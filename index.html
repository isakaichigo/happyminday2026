<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAPPY MIN DAY 2026 - Photo Collage</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #f5f5f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .view-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 多語言切換按鈕 */
    .lang-switch {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      width: 100%;
      justify-content: center;
    }

    .lang-btn {
      background-color: #ffffff;
      border: 1px solid #e0e0e0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-btn.active {
      background-color: #F8B62D;
      color: #ffffff;
      border-color: #F8B62D;
    }

    /* 主卡片容器 */
    .card-container {
      background-color: #ffffff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      border: 2px solid #e0e0e0;
      width: 100%;
    }

    /* 頂部橘色區塊 */
    .captcha-header {
      background-color: #F8B62D;
      border-radius: 8px;
      padding: 16px 20px;
      color: #ffffff;
      margin-bottom: 16px;
    }

    .captcha-sub {
      font-size: 14px;
      font-weight: 500;
      opacity: 0.9;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .captcha-main {
      font-size: 26px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: 0.5px;
    }

    /* 九宮格容器 */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background-color: #ffffff;
      margin-bottom: 16px;
    }

    .grid-item {
      aspect-ratio: 1 / 1;
      background-color: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .grid-item:hover {
      background-color: #e8e8e8;
    }

    /* 預設加號標誌（排除鎖定的中間格） */
    .grid-item:not(.locked-block)::before {
      content: '+';
      font-size: 36px;
      color: #bbb;
      font-weight: 300;
    }

    .grid-item.has-image::before {
      display: none;
    }

    .grid-item.selected {
      outline: 3px solid #F8B62D;
      outline-offset: -3px;
      z-index: 2;
    }

    /* 中間固定浮起格 */
    .grid-item.locked-block {
      overflow: visible !important;
      background-color: transparent;
      cursor: default !important;
      z-index: 3;
    }

    /* 中間你寫死的固定圖片 */
    .center-user-photo {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      /* 👇 在這裡放入你想寫死的中間圖片網址 */
      background-image: url('YOUR_IMAGE_URL.jpg'); 
      z-index: 1;
    }

    /* 上層蓋住的拍立得框 PNG */
    .polaroid-frame-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -42%) scale(1.05);
      width: 104%;
      height: auto;
      pointer-events: none;
      z-index: 5;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.15));
    }

    /* 圖片包裹與拉桿 */
    .img-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      transform-origin: center center;
    }

    .delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 12px;
      display: none;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
    }

    .grid-item:not(.locked-block).has-image:hover .delete-btn,
    .grid-item:not(.locked-block).selected .delete-btn {
      display: flex;
    }

    .zoom-control {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      background: rgba(255, 255, 255, 0.9);
      padding: 2px 6px;
      border-radius: 10px;
      display: none;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .grid-item:not(.locked-block).selected .zoom-control {
      display: flex;
    }

    .zoom-control input {
      width: 100%;
      accent-color: #F8B62D;
    }

    /* 底部社群列 */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 4px 0 4px;
    }

    .footer-icons {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .footer-icons svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #222;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .done-btn {
      background-color: #F8B62D;
      color: #ffffff;
      font-weight: 900;
      font-style: italic;
      font-size: 18px;
      padding: 8px 24px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    /* 操作按鈕區 */
    .action-buttons {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
      text-align: center;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-download {
      background-color: #F8B62D;
      color: #ffffff;
    }

    .btn-share {
      background-color: #000000;
      color: #ffffff;
    }

    .author-tag {
      margin-top: 12px;
      font-size: 12px;
      color: #888;
      text-align: center;
    }

    /* 完成與 QR Code 頁面樣式 */
    .result-view {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .result-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      width: 100%;
      text-align: center;
    }

    .result-title {
      font-size: 20px;
      font-weight: 800;
      color: #222;
      margin-bottom: 8px;
    }

    .result-desc {
      font-size: 13.5px;
      color: #666;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .result-img-preview {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .btn-secondary {
      background-color: #f2f2f7;
      color: #333;
      margin-top: 10px;
    }

    .qr-img {
      width: 220px;
      height: 220px;
      margin: 10px auto 20px auto;
      border-radius: 12px;
      display: block;
      border: 1px solid #eee;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
