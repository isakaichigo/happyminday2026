<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>圖片顯示與分享至 X</title>
  <style>
    .image-container {
      max-width: 500px;
      margin: 20px auto;
      text-align: center;
    }
    .image-container img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .btn-share {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #000;
      color: #fff;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 16px;
    }
    .btn-share:hover {
      background-color: #333;
    }
  </style>
</head>
<body>

  <div class="image-container">
    <!-- 1. 頁面上顯示的圖片 -->
    <img id="target-image" src="https://picsum.photos/600/400" alt="分享圖片">
    
    <!-- 2. 按鈕：觸發下載並跳轉 X -->
    <br>
    <button class="btn-share" onclick="handleShareToX()">發送到 X 並下載圖片</button>
  </div>

  <script>
    /**
     * 將圖片下載至本地的 async 函式
     */
    async function downloadImage(imageUrl, fileName = 'share-image.png') {
      try {
        // 如果是跨域圖片，使用 fetch 轉為 Blob 物件
        const response = await fetch(imageUrl, { mode: 'cors' });
        if (!response.ok) throw new Error('圖片讀取失敗');
        
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        
        // 建立隱藏的 <a> 標籤觸發下載
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        
        // 清除記憶體與節點
        document.body.removeChild(link);
        URL.revokeObjectURL(blobUrl);
      } catch (error) {
        console.error('下載圖片時發生錯誤：', error);
        
        // 備用方案：如果是 Base64 或是伺服器不支援 CORS Fetch，嘗試直接開下載標籤
        const fallbackLink = document.createElement('a');
        fallbackLink.href = imageUrl;
        fallbackLink.download = fileName;
        fallbackLink.target = '_blank';
        document.body.appendChild(fallbackLink);
        fallbackLink.click();
        document.body.removeChild(fallbackLink);
      }
    }

    /**
     * 處理點擊「發送到 X」按鈕的主要邏輯
     */
    function handleShareToX() {
      // 取得圖片 URL（若是寫死的變數，也可直接替換）
      const imgElement = document.getElementById('target-image');
      const imageUrl = imgElement.src;
      
      // 設定發送到 X 的文字內容（可自由修改）
      const tweetText = "來看看這張精彩的圖片！";

      // 1. 執行下載圖片
      downloadImage(imageUrl, 'my-x-share-image.png');

      // 2. 開啟 X 的發文頁面 (Web Intent URL)
      const twitterShareUrl = `https://x.com/intent/tweet?text=${encodeURIComponent(tweetText)}`;
      window.open(twitterShareUrl, '_blank');
    }
  </script>

</body>
</html>
